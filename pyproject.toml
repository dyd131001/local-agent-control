[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-control-center"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9",
  "markdown>=3.6,<4",
  "bleach>=6,<7",
  "openai-codex==0.158.0",
  "pypdf>=6.19,<7",
]

[project.scripts]
control-center = "app.main:run"

[project.optional-dependencies]
test = ["httpx==0.28.1", "playwright==1.63.0"]

[tool.setuptools]
packages = ["app", "app.migrations", "app.migrations.versions"]

[tool.setuptools.package-data]
app = ["static/*"]
